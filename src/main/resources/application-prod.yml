spring:
  config:
    activate:
      on-profile: prod

    import:
      - optional:configserver:http://config-server:8888

  kafka:
    bootstrap-servers: ${KAFKA_EXTERNAL_HOST:host.docker.internal}:${KAFKA_EXTERNAL_PORT}

eureka:
  instance:
    prefer-ip-address: true

  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://pagely-eureka:8000/eureka/}
